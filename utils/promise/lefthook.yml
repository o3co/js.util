pre-commit:
  parallel: true
  jobs:
    - root: utils/promise
      glob: utils/promise/*.{js,ts,mjs,mts}
      run: pnpx @biomejs/biome check --config-path ./biome.jsonc --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - root: utils/promise
      glob: utils/promise/*.{js,ts,mjs,mts}
      run: pnpm run typecheck
      stage_fixed: true
