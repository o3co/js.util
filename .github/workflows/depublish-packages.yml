# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created

name: Depublish Packages 
    
on:
  release:
    types: [deleted]

jobs:
  depublish-storage:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - id: version
        run: |
          OWNER="o3co"
          PACKAGE_NAME="js.util.storage"
          PACKAGE_TYPE="npm"
          API_URL="orgs/$OWNER/packages/${PACKAGE_TYPE}/${PACKAGE_NAME}/versions"

          # GitHub CLIを使用してパッケージバージョンをリストし、jqでフィルタリングしてIDを取得
          VERSION_ID=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            --jq 'map(select(.name == "'${{github.event.release.tag_name}}'")) | .[0].id')
          
          echo "::notice::Delete Package ${VERSION_ID}"

          if [ -z "$VERSION_ID" ]; then
            echo "::notice::No package found"
          else
            $(gh api \
              --method DELETE \
              --input /dev/null \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}/${VERSION_ID}" 
            )
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
